<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Markdown 编辑器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-base: #0a0a0f;
      --bg-elevated: rgba(22, 22, 35, 0.6);
      --bg-surface: rgba(30, 30, 46, 0.5);
      --bg-hover: rgba(255, 255, 255, 0.06);
      --bg-active: rgba(255, 255, 255, 0.1);
      --accent-1: #a78bfa;
      --accent-2: #60a5fa;
      --accent-3: #f472b6;
      --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
      --accent-gradient-glow: linear-gradient(135deg, rgba(167, 139, 250, 0.4) 0%, rgba(96, 165, 250, 0.4) 100%);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --shadow-glow: 0 0 24px rgba(167, 139, 250, 0.25);
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(167, 139, 250, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(96, 165, 250, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(244, 114, 182, 0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    header, .toolbar, .main-container, footer { position: relative; z-index: 1; }
    header {
      height: 64px;
      background: var(--bg-elevated);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.02em;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow);
      flex-shrink: 0;
    }
    .logo-icon svg { width: 20px; height: 20px; color: #0a0a0f; stroke-width: 2.5; }
    .logo-text {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent-gradient);
      color: #0a0a0f;
      box-shadow: 0 4px 16px rgba(167, 139, 250, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(167, 139, 250, 0.45);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-primary);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .btn-secondary:hover {
      background: var(--bg-active);
      border-color: var(--border-strong);
    }
    
    .toolbar {
      background: var(--bg-elevated);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 6px;
      overflow-x: auto;
      flex-wrap: wrap;
      min-height: 64px;
    }
    .toolbar::-webkit-scrollbar { height: 4px; }
    .toolbar::-webkit-scrollbar-track { background: transparent; }
    .toolbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .toolbar-group + .toolbar-group { margin-left: 4px; }
    
    .toolbar-btn {
      padding: 7px 11px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      position: relative;
    }
    .toolbar-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .toolbar-btn:active {
      transform: scale(0.94);
    }
    .toolbar-btn[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: fixed;
      top: calc(var(--tooltip-top, 0px) + 8px);
      left: var(--tooltip-left);
      transform: translateX(-50%);
      background: rgba(15, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-strong);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      z-index: 10000;
      color: var(--text-primary);
      pointer-events: none;
      box-shadow: var(--shadow-card);
    }
    .toolbar-btn svg { width: 16px; height: 16px; }
    
    .main-container { flex: 1; display: flex; overflow: hidden; gap: 1px; background: var(--border); }
    .editor-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
    }
    .editor {
      flex: 1;
      width: 100%;
      padding: 24px;
      background: transparent;
      color: var(--text-primary);
      border: none;
      resize: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.7;
      outline: none;
      caret-color: var(--accent-1);
    }
    .editor::placeholder { color: var(--text-muted); }
    .preview-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
    }
    .panel-label {
      height: 38px;
      background: var(--bg-elevated);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .panel-label .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-gradient);
      margin-right: 10px;
      box-shadow: 0 0 8px rgba(167, 139, 250, 0.6);
    }
    .preview {
      flex: 1;
      padding: 24px 32px;
      background: transparent;
      overflow-y: auto;
      line-height: 1.75;
    }
    .preview::-webkit-scrollbar, .editor::-webkit-scrollbar { width: 8px; }
    .preview::-webkit-scrollbar-track, .editor::-webkit-scrollbar-track { background: transparent; }
    .preview::-webkit-scrollbar-thumb, .editor::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }
    .preview::-webkit-scrollbar-thumb:hover, .editor::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .preview h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 24px 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .preview h2 {
      font-size: 21px;
      font-weight: 600;
      margin: 22px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.01em;
    }
    .preview h3 { font-size: 18px; font-weight: 600; margin: 20px 0 10px; letter-spacing: -0.01em; }
    .preview h4, .preview h5, .preview h6 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: var(--text-secondary); }
    .preview p { margin: 12px 0; color: var(--text-primary); }
    .preview a {
      color: var(--accent-2);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .preview a:hover { border-bottom-color: var(--accent-2); }
    .preview strong { color: var(--text-primary); font-weight: 600; }
    .preview code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(167, 139, 250, 0.12);
      color: var(--accent-1);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 13px;
      border: 1px solid rgba(167, 139, 250, 0.15);
    }
    .preview pre {
      background: rgba(10, 10, 15, 0.6);
      padding: 18px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 14px 0;
      border: 1px solid var(--border);
    }
    .preview pre code {
      background: transparent;
      color: var(--text-primary);
      padding: 0;
      border: none;
      font-size: 13px;
    }
    .preview blockquote {
      border-left: 3px solid var(--accent-1);
      padding: 8px 18px;
      margin: 14px 0;
      color: var(--text-secondary);
      background: rgba(167, 139, 250, 0.05);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .preview blockquote.admonition {
      border-left: 3px solid var(--accent-1);
      background: var(--bg-surface);
      backdrop-filter: blur(10px);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin: 14px 0;
      border: 1px solid var(--border);
    }
    .preview blockquote.admonition-note { border-left-color: var(--accent-2); }
    .preview blockquote.admonition-warning { border-left-color: #fbbf24; }
    .preview blockquote.admonition-danger { border-left-color: #f87171; }
    .preview blockquote.admonition-tip { border-left-color: #34d399; }
    .preview blockquote.admonition-tip .admonition-title { color: #34d399; }
    .preview blockquote.admonition-warning .admonition-title { color: #fbbf24; }
    .preview blockquote.admonition-danger .admonition-title { color: #f87171; }
    .preview blockquote.admonition-note .admonition-title { color: var(--accent-2); }
    .admonition-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
      font-size: 13px;
      letter-spacing: 0.03em;
    }
    .preview details {
      background: var(--bg-surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin: 14px 0;
      overflow: hidden;
    }
    .preview summary {
      padding: 12px 18px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      font-weight: 500;
      transition: background 0.2s;
    }
    .preview summary:hover { background: var(--bg-hover); }
    .preview details[open] summary { border-bottom: 1px solid var(--border); }
    .preview details-content { padding: 14px 18px; }
    
    .preview ul, .preview ol { margin: 12px 0; padding-left: 24px; }
    .preview li { margin: 6px 0; }
    .preview ul li::marker { color: var(--accent-1); }
    .preview ol li::marker { color: var(--accent-2); font-weight: 600; }
    .preview hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .preview th, .preview td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
    .preview th { background: rgba(255, 255, 255, 0.04); font-weight: 600; color: var(--text-primary); }
    .preview td { color: var(--text-secondary); }
    .preview img { max-width: 100%; border-radius: var(--radius-md); border: 1px solid var(--border); }
    
    .footer {
      height: 44px;
      background: var(--bg-elevated);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 16px;
      box-sizing: border-box;
    }
    .footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover { color: var(--accent-2); }
    
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: rgba(15, 15, 25, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: none;
      z-index: 100;
      min-width: 160px;
      box-shadow: var(--shadow-card);
      padding: 4px;
    }
    .dropdown-menu.show { display: block; animation: dropdownIn 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dropdown-menu button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .dropdown-menu button:hover { background: var(--bg-hover); }
    .hidden-input { display: none; }
    
    .emoji-popup {
      position: fixed;
      background: rgba(15, 15, 25, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 14px;
      max-height: 340px;
      overflow-y: auto;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      width: 340px;
      gap: 4px;
      box-shadow: var(--shadow-card);
    }
    .emoji-popup input {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .emoji-popup input:focus { border-color: var(--accent-1); }
    .emoji-popup input::placeholder { color: var(--text-muted); }
    .emoji-btn {
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .emoji-btn:hover {
      background: var(--bg-hover);
      transform: scale(1.15);
    }
    
    @media (max-width: 768px) {
      header { height: 54px; padding: 0 14px; }
      .logo { font-size: 15px; gap: 8px; }
      .logo-icon { width: 30px; height: 30px; }
      .logo-icon svg { width: 16px; height: 16px; }
      .header-actions { gap: 6px; }
      .btn { padding: 7px 12px; font-size: 12px; }
      
      .toolbar { padding: 8px; min-height: 52px; gap: 4px; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
      .toolbar-group { padding: 3px; gap: 1px; }
      .toolbar-group + .toolbar-group { margin-left: 2px; }
      .toolbar-btn { min-width: 36px; height: 36px; padding: 8px; font-size: 14px; }
      
      .main-container { flex-direction: column; gap: 1px; }
      .editor-panel, .preview-panel { width: 100%; height: 50%; }
      .editor { font-size: 16px; padding: 14px; }
      .preview { padding: 14px 18px; }
      .preview h1 { font-size: 21px; }
      .preview h2 { font-size: 18px; }
      .preview h3 { font-size: 16px; }
      .preview h4, .preview h5, .preview h6 { font-size: 14px; }
      .panel-label { height: 34px; padding: 0 14px; font-size: 11px; }
      
      .emoji-popup { width: 290px; max-height: 280px; }
      
      .footer {
        flex-direction: column;
        height: auto;
        min-height: 50px;
        padding: 10px 20px;
        padding-bottom: max(10px, calc(env(safe-area-inset-bottom) + 8px));
        padding-left: max(20px, calc(env(safe-area-inset-left) + 4px));
        padding-right: max(20px, calc(env(safe-area-inset-right) + 4px));
        gap: 6px;
        font-size: 11px;
        text-align: center;
        line-height: 1.4;
      }
      
      .dropdown-menu {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        max-height: 50vh;
        overflow-y: auto;
        margin: 0;
      }
      .dropdown-menu button { padding: 14px 18px; font-size: 16px; min-height: 48px; }
    }
    
    @media (max-width: 480px) {
      header { height: 48px; padding: 0 10px; }
      .logo { font-size: 13px; gap: 6px; }
      .logo-icon { width: 26px; height: 26px; }
      .logo-icon svg { width: 14px; height: 14px; }
      .header-actions { gap: 4px; }
      .btn { padding: 6px 10px; font-size: 11px; }
      
      .toolbar { padding: 6px; }
      .toolbar-group { padding: 2px; }
      .toolbar-btn { min-width: 32px; height: 32px; padding: 6px; }
      
      .editor-panel, .preview-panel { height: 45%; }
      .editor { font-size: 15px; }
      .preview h1 { font-size: 19px; }
      .preview h2 { font-size: 16px; }
      .preview h3 { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
      </div>
      <span class="logo-text">Markdown 编辑器</span>
    </div>
    <div class="header-actions">
      <input type="file" id="fileInput" class="hidden-input" accept=".md,.txt">
      <button class="btn btn-secondary" id="importBtn">导入</button>
      <div class="dropdown">
        <button class="btn btn-primary" id="exportBtn">导出</button>
        <div class="dropdown-menu" id="dropdownMenu">
          <button id="exportMd">导出为 .md</button>
          <button id="exportHtml">导出为 .html</button>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="undo" data-tooltip="撤销 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>
      <button class="toolbar-btn" data-action="redo" data-tooltip="重做 (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
        </svg>
      </button>
    </div>
    
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="bold" data-tooltip="粗体 **文本**">B</button>
      <button class="toolbar-btn" data-action="italic" data-tooltip="斜体 *文本*">I</button>
      <button class="toolbar-btn" data-action="strike" data-tooltip="删除线 ~~文本~~">S</button>
    </div>
    
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="h1" data-tooltip="一级标题 # 标题">H1</button>
      <button class="toolbar-btn" data-action="h2" data-tooltip="二级标题 ## 标题">H2</button>
      <button class="toolbar-btn" data-action="h3" data-tooltip="三级标题 ### 标题">H3</button>
    </div>
    
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="link" data-tooltip="链接 [文本](url)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>

    <div class="toolbar-group">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="quote" data-tooltip="引用 > 文本">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21z"></path>
          <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path>

    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="ul" data-tooltip="无序列表 - 项目">

      </button>
      <button class="toolbar-btn" data-action="table" data-tooltip="表格 | 列 |">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="3" y1="15" x2="21" y2="15"></line>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>

    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="emoji" data-tooltip="Emoji 表情">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
          <line x1="9" y1="9" x2="9.01" y2="9"></line>

  <div class="main-container">
    <div class="editor-panel">
      <textarea class="editor" id="editor" placeholder="开始编写Markdown..."></textarea>
    </div>
    <div class="preview-panel">
      <div class="panel-label"><span class="dot"></span>预览</div>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <footer class="footer">
    <span>&copy; 2026 <a href="https://sylv.top/" target="_blank" rel="noopener noreferrer">Sylvy</a>. All rights reserved.</span>
    <span>|</span>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">豫ICP备2026013756号-1</a>
  </footer>

  <script src="marked.min.js"></script>
  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const fileInput = document.getElementById('fileInput');
    const importBtn = document.getElementById('importBtn');
    const exportBtn = document.getElementById('exportBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const exportMd = document.getElementById('exportMd');
    const exportHtml = document.getElementById('exportHtml');
    const toolbarBtns = document.querySelectorAll('.toolbar-btn');

    const historyStack = [];
    let historyIndex = -1;
    let isUndoRedo = false;

    function saveHistory() {
      if (isUndoRedo) return;
      const content = editor.value;
      if (historyStack[historyIndex] !== content) {
        historyStack.splice(historyIndex + 1);
        historyStack.push(content);
        historyIndex++;
        if (historyStack.length > 50) { historyStack.shift(); historyIndex--; }
      }
    }

    function renderCustomDetails(html) {
      return html.replace(/:::details\[([^\]]+)\]<br\s*\/?>/g, '<details><summary>$1</summary><div class="details-content">')
        .replace(/:::details<br\s*\/?>/g, '<details><summary>点击展开</summary><div class="details-content"><p>')
        .replace(/:::<br\s*\/?>/g, '</div></details><p>');
    }

    marked.setOptions({ breaks: true, gfm: true });
    
    function updatePreview() {
      let markdown = editor.value;
      let admonitionMap = [];
      
      markdown = markdown.replace(/>\s*\[!(\w+)\]([^\n]*(?:\n\s*>[^\n]*)*)/gi, (match, type, content) => {
        type = type.toLowerCase();
        const cleanedContent = content.split('\n').map(line => line.replace(/^\s*>\s*/, '')).join('\n').trim();
        admonitionMap.push({ type, content: cleanedContent });
        return `<ADMNITN${admonitionMap.length - 1}>`;
      });
      
      let html = marked.parse(markdown);
      
      for (let index = 0; index < admonitionMap.length; index++) {
        const admonition = admonitionMap[index];
        let contentHtml = admonition.content ? marked.parseInline(admonition.content) : '';
        const titleMap = {
          'note': 'NOTE',
          'tip': 'TIP',
          'important': 'IMPORTANT',
          'warning': 'WARNING',
          'caution': 'CAUTION'
        };
        const title = titleMap[admonition.type] || admonition.type;
        const admonitionHtml = `<blockquote class="admonition admonition-${admonition.type}"><span class="admonition-title">${title}</span>${contentHtml}</blockquote>`;
        
        const placeholder = `<ADMNITN${index}>`;
        html = html.replace(`<p>${placeholder}</p>`, admonitionHtml);
        html = html.replace(placeholder, admonitionHtml);
      }
      
      html = renderCustomDetails(html);
      
      preview.innerHTML = html;
    }

    editor.addEventListener('input', () => { saveHistory(); updatePreview(); });

    const emojiList = ['😀', '😃', '😄', '😁', '😆', '😅', '😂', '🤣', '😊', '😇', '🙂', '🙃', '😉', '😌', '😍', '🥰', '😘', '😗', '😙', '😚', '😋', '😛', '😜', '😝', '🤑', '🤗', '🤭', '🤫', '🤔', '🤐', '😐', '😑', '😶', '😏', '😒', '🙄', '😬', '🤯', '😳', '🥵', '🥶', '😴', '😪', '😵', '😰', '🥱', '😢', '😭', '😤', '😠', '😡', '🤬', '😈', '👿', '💀', '☠️', '💩', '🤡', '👹', '👺', '👻', '👽', '👾', '🤖', '👋', '🤚', '🖐️', '✋', '👌', '✌️', '🤞', '🤟', '🤘', '👈', '👉', '👆', '🖕', '👇', '☝️', '👍', '👎', '✊', '👊', '👏', '👏', '👐', '🤝', '🙏', '💪', '🦾', '👂', '🧠', '👀', '👶', '🧒', '👦', '👧', '🧑', '👨', '👩', '🐶', '🐱', '🐭', '🐰', '🦊', '🐻', '🐼', '🐨', '🦁', '🐮', '🐷', '🐸', '🐵', '🐒', '🦋', '🐞', '🐜', '🐙', '🦑', '🦀', '🐠', '🐟', '🐬', '🦈', '🐊', '🐅', '🐆', '🦓', '🦍', '🐘', '🦏', '🐪', '🐫', '🐃', '🐂', '🐄', '🐎', '🐖', '🐑', '🐐', '🦌', '🐕', '🐩', '🐈', '🕊️', '🐇', '🦝', '🦡', '🌸', '🌹', '🌻', '🌺', '🌱', '🌲', '🌳', '🍀', '🍁', '🍂', '🍃', '🍇', '🍈', '🍉', '🍊', '🍋', '🍌', '🍍', '🍏', '🍎', '🍐', '🍑', '🍒', '🍓', '🍅', '🥔', '🥕', '🌽', '🌶️', '🥒', '🥬', '🍄', '🥜', '🍞', '🥐', '🥖', '🥚', '🍳', '🥞', '🥓', '🥩', '🍗', '🍖', '🌭', '🍔', '🍟', '🍕', '🌮', '🌯', '🍝', '🍜', '🍲', '🍛', '🍣', '🍱', '🍙', '🍚', '🍘', '🍥', '🍤', '🍡', '🍧', '🍨', '🍦', '🥧', '🧁', '🍰', '🎂', '🍮', '🍭', '🍬', '🍫', '🍿', '🍩', '🍪', '☕', '🍵', '🧃', '🍶', '🍺', '🍻', '🥂', '🍷', '🥃', '🍸', '🍹', '🍾', '🧊', '✅', '❌', '⚠️', '🔔', '💯', '❗', '❓'];

function insertMarkdown(before, after = '') {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const selected = editor.value.substring(start, end);
      const newText = before + selected + after;
      editor.setRangeText(newText, start, end, 'end');
      
      if (selected) {
        const newPos = end + after.length;
        editor.setSelectionRange(newPos, newPos);
      } else {
        const newPos = start + before.length;
        editor.setSelectionRange(newPos, newPos);
      }
      
      editor.focus();
      saveHistory();
      updatePreview();
    }

    const actions = {
      undo: () => {
        if (historyIndex > 0) {
          isUndoRedo = true;
          historyIndex--;
          editor.value = historyStack[historyIndex];
          editor.focus();
          updatePreview();
          setTimeout(() => isUndoRedo = false, 10);
        }
      },
      redo: () => {
        if (historyIndex < historyStack.length - 1) {
          isUndoRedo = true;
          historyIndex++;
          editor.value = historyStack[historyIndex];
          editor.focus();
          updatePreview();
          setTimeout(() => isUndoRedo = false, 10);
        }
      },
      bold: () => insertMarkdown('**', '**'),
      italic: () => insertMarkdown('*', '*'),
      strike: () => insertMarkdown('~~', '~~'),
      h1: () => insertMarkdown('# ', ''),
      h2: () => insertMarkdown('## ', ''),
      h3: () => insertMarkdown('### ', ''),
      link: () => insertMarkdown('[', '](url)'),
      image: () => insertMarkdown('![', '](url)'),
      code: () => insertMarkdown('`', '`'),
      'codeblock-fence': () => insertMarkdown('```\n', '\n```'),
      quote: () => insertMarkdown('> '),
      ul: () => insertMarkdown('- '),
      ol: () => insertMarkdown('1. '),
      hr: () => insertMarkdown('\n---\n'),
      table: () => insertMarkdown('| 列1 | 列2 | 列3 |\n|------|------|------|\n|    |    |    |'),
      details: () => insertMarkdown('\n:::details[标题]\n', '\n'),
      emoji: (e) => {
        const start = editor.selectionStart;
        const btn = e.target.closest('.toolbar-btn');
        const rect = btn.getBoundingClientRect();
        
        const popup = document.createElement('div');
        popup.className = 'emoji-popup';
        popup.style.top = (rect.bottom + 8) + 'px';
        popup.style.left = rect.left + 'px';
        
        const searchInput = document.createElement('input');
        searchInput.placeholder = '搜索 emoji...';
        popup.appendChild(searchInput);
        
        const scrollDiv = document.createElement('div');
        scrollDiv.style.cssText = 'max-height:200px;overflow-y:auto;width:100%;';
        
        const displayEmojis = () => {
          scrollDiv.innerHTML = '';
          const filter = searchInput.value;
          const filtered = filter ? emojiList.slice(0, 50) : emojiList;
          
          filtered.forEach(emoji => {
            const btn = document.createElement('button');
            btn.className = 'emoji-btn';
            btn.textContent = emoji;
            btn.addEventListener('click', () => {
              editor.setRangeText(emoji, start, start, 'end');
              editor.focus();
              saveHistory();
              updatePreview();
              popup.remove();
            });
            scrollDiv.appendChild(btn);
          });
        };
        
        displayEmojis();
        searchInput.addEventListener('input', displayEmojis);
        
        popup.appendChild(scrollDiv);
        document.body.appendChild(popup);
        
        const closePopup = (ev) => {
          if (!popup.contains(ev.target) && !ev.target.closest('[data-action="emoji"]')) {
            popup.remove();
            document.removeEventListener('click', closePopup);
          }
        };
        setTimeout(() => document.addEventListener('click', closePopup), 100);
      }
    };

    const admonitionBtn = document.getElementById('admonitionBtn');
    let admonitionMenu = null;
    
    admonitionBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      
      if (admonitionMenu) {
        admonitionMenu.remove();
        admonitionMenu = null;
        return;
      }
      
      const rect = admonitionBtn.getBoundingClientRect();
      
      admonitionMenu = document.createElement('div');
      admonitionMenu.style.cssText = 'position:fixed;top:' + (rect.bottom + 8) + 'px;left:' + rect.left + 'px;background:rgba(15, 15, 25, 0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-strong);border-radius:12px;z-index:99999;min-width:120px;overflow:hidden;padding:4px;box-shadow:0 8px 32px rgba(0,0,0,0.4);';
      
      const types = ['note', 'tip', 'important', 'warning', 'caution'];
      types.forEach(type => {
        const btn = document.createElement('button');
        btn.style.cssText = 'display:block;width:100%;padding:10px 14px;border:none;background:transparent;color:var(--text-primary);cursor:pointer;text-align:left;white-space:nowrap;font-size:13px;font-weight:500;font-family:inherit;border-radius:6px;';
        btn.textContent = type;
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const upperType = type.charAt(0).toUpperCase() + type.slice(1);
          insertMarkdown('\n> [!' + upperType + ']\n> ', '\n\n');
          admonitionMenu.remove();
          admonitionMenu = null;
        });
        btn.addEventListener('mouseenter', () => { btn.style.background = 'var(--bg-hover)'; });
        btn.addEventListener('mouseleave', () => { btn.style.background = 'transparent'; });
        admonitionMenu.appendChild(btn);
      });
      
      document.body.appendChild(admonitionMenu);
      
      const closeMenu = (ev) => {
        if (admonitionMenu && !admonitionMenu.contains(ev.target) && ev.target !== admonitionBtn) {
          admonitionMenu.remove();
          admonitionMenu = null;
          document.removeEventListener('click', closeMenu);
        }
      };
      setTimeout(() => document.addEventListener('click', closeMenu), 100);
    });

    toolbarBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = btn.dataset.action;
        if (actions[action]) { actions[action](e); }
      });
    });

    importBtn.addEventListener('click', () => { fileInput.click(); });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          editor.value = event.target.result;
          saveHistory();
          updatePreview();
        };
        reader.readAsText(file);
      }
      fileInput.value = '';
    });

    exportBtn.addEventListener('click', () => { dropdownMenu.classList.toggle('show'); });

    document.addEventListener('click', (e) => {
      if (!exportBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.remove('show');
      }
    });

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      dropdownMenu.classList.remove('show');
    }

    exportMd.addEventListener('click', () => { downloadFile('文档.md', editor.value, 'text/markdown'); });

    exportHtml.addEventListener('click', () => {
      const htmlContent = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; line-height: 1.6; color: #333; }
    h1, h2, h3 { margin-top: 24px; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
    pre { background: #f4f4f4; padding: 16px; border-radius: 8px; overflow-x: auto; }
    pre code { background: transparent; padding: 0; }
    blockquote { border-left: 4px solid #cba6f7; padding-left: 16px; margin: 16px 0; color: #666; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f4f4f4; }
    img { max-width: 100%; }
  </style>
</head>
<body>
${preview.innerHTML}
</body>
</html>`;
      downloadFile('文档.html', htmlContent, 'text/html');
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        downloadFile('文档.md', editor.value, 'text/markdown');
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); actions.undo(); }
      if (((e.ctrlKey || e.metaKey) && e.key === 'y') || ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z')) {
        e.preventDefault();
        actions.redo();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); actions.bold(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); actions.italic(); }
    });

    document.querySelectorAll('.toolbar-btn').forEach(btn => {
      btn.addEventListener('mouseenter', (e) => {
        const rect = btn.getBoundingClientRect();
        btn.style.setProperty('--tooltip-top', rect.bottom + 'px');
        btn.style.setProperty('--tooltip-left', (rect.left + rect.width / 2) + 'px');
      });
    });

    if ('ontouchstart' in window) {
      document.querySelectorAll('.toolbar-btn, .btn, .dropdown-menu button, .emoji-btn').forEach(el => {
        el.addEventListener('touchstart', () => { el.style.opacity = '0.7'; }, { passive: true });
        el.addEventListener('touchend', () => { el.style.opacity = '1'; }, { passive: true });
      });
    }

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    saveHistory();
  </script>
</body>
</html>
